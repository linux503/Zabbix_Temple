# 20 套模板扩展 UserParameter（与 templates/06-20 对应）
# 复制到 /etc/zabbix/zabbix_agentd.d/ 后重启 agent

UserParameter=apache[*],/etc/zabbix/scripts/extras/app_metrics.sh apache "$1" "$2"
UserParameter=pgsql.ping,/etc/zabbix/scripts/extras/app_metrics.sh pgsql ping
UserParameter=pgsql.version,/etc/zabbix/scripts/extras/app_metrics.sh pgsql version
UserParameter=pgsql.connections,/etc/zabbix/scripts/extras/app_metrics.sh pgsql connections
UserParameter=pgsql.active,/etc/zabbix/scripts/extras/app_metrics.sh pgsql active
UserParameter=pgsql.idle,/etc/zabbix/scripts/extras/app_metrics.sh pgsql idle
UserParameter=pgsql.commits,/etc/zabbix/scripts/extras/app_metrics.sh pgsql commits
UserParameter=pgsql.rollbacks,/etc/zabbix/scripts/extras/app_metrics.sh pgsql rollbacks
UserParameter=pgsql.deadlocks,/etc/zabbix/scripts/extras/app_metrics.sh pgsql deadlocks
UserParameter=memcached[*],/etc/zabbix/scripts/extras/app_metrics.sh memcached "$1"
UserParameter=rabbitmq[*],/etc/zabbix/scripts/extras/app_metrics.sh rabbitmq "$1" "$2"
UserParameter=elasticsearch[*],/etc/zabbix/scripts/extras/app_metrics.sh elasticsearch "$1" "$2"
UserParameter=haproxy[*],/etc/zabbix/scripts/extras/app_metrics.sh haproxy "$1" "$2"
UserParameter=phpfpm[*],/etc/zabbix/scripts/extras/app_metrics.sh phpfpm "$1" "$2"
UserParameter=docker[*],/etc/zabbix/scripts/extras/app_metrics.sh docker "$1"
UserParameter=keepalived[*],/etc/zabbix/scripts/extras/app_metrics.sh keepalived "$1" "$2"
UserParameter=zookeeper[*],/etc/zabbix/scripts/extras/app_metrics.sh zookeeper "$1" "$2"
UserParameter=kafka[*],/etc/zabbix/scripts/extras/app_metrics.sh kafka "$1"
UserParameter=tomcat[*],/etc/zabbix/scripts/extras/app_metrics.sh tomcat "$1"
UserParameter=web.http.code[*],/etc/zabbix/scripts/extras/app_metrics.sh http code "$1"
UserParameter=web.http.time[*],/etc/zabbix/scripts/extras/app_metrics.sh http time "$1"
UserParameter=web.http.alive[*],/etc/zabbix/scripts/extras/app_metrics.sh http alive "$1"
UserParameter=etcd[*],/etc/zabbix/scripts/extras/app_metrics.sh etcd "$1" "$2"
